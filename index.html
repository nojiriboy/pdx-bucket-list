<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portland Bucket List Checklist</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --checked-text: #64748b;
      --deleted-text: #dc2626;
      --deleted-bg: #fef2f2;
      --accent: #0f766e;
      --border: #e2e8f0;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      padding: 2rem;
    }
    h1 {
      margin-top: 0;
      font-size: 1.75rem;
      color: var(--accent);
    }
    p.subtitle {
      margin-top: -0.5rem;
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      color: #475569;
    }
    .reset-btn {
      background: none;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: #475569;
    }
    .reset-btn:hover {
      background: #f1f5f9;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li.item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }
    li.item:hover {
      background-color: #f8fafc;
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex: 1;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    .item-title {
      font-size: 1rem;
      line-height: 1.4;
    }
    /* Checked State: Moved to bottom, visible, strikethrough font */
    li.item.checked {
      background-color: #f8fafc;
    }
    li.item.checked .item-title {
      text-decoration: line-through;
      color: var(--checked-text);
      font-style: italic;
    }
    /* Deleted State: Moved to bottom, red & distinct font with trashcan icon */
    li.item.deleted {
      background-color: var(--deleted-bg);
    }
    li.item.deleted .item-title {
      color: var(--deleted-text);
      font-family: 'Courier New', Courier, monospace;
      font-weight: 600;
    }
    .actions {
      display: flex;
      gap: 0.5rem;
      margin-left: 1rem;
    }
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .btn-delete:hover {
      background: #fee2e2;
    }
    .btn-restore {
      font-size: 0.8rem;
      color: #475569;
      border: 1px solid #cbd5e1;
      background: #ffffff;
    }
    .btn-restore:hover {
      background: #f1f5f9;
    }
  </style>
</head>
<body>

    <ul id="checklist"></ul>
  </div>
